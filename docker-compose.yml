# Stock Core completo con un solo comando:   docker compose up --build
# Antes, copia .env.example a .env. Los valores (contraseñas, la clave de la API externa) se leen de .env,
# que no se versiona; este archivo solo tiene referencias ${...} (RD-10).
name: stockcore

services:
  # Motor de base de datos. NO publica puertos: solo lo alcanzan los otros servicios por su nombre «db».
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD. Copia .env.example a .env}
    volumes:
      - datos-sqlserver:/var/opt/mssql   # RD-09: usuarios, solicitudes, órdenes y registros de documentos
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" -o /dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # La API. Es el ÚNICO servicio que publica un puerto: http://localhost:5001
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=Inventario;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5001}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Falta ADMIN_EMAIL. Copia .env.example a .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD. Copia .env.example a .env}
      EXCHANGE_API_KEY: ${EXCHANGE_API_KEY:-}
      EXCHANGE_API_URL: ${EXCHANGE_API_URL:-https://v6.exchangerate-api.com/v6/}
      ACTIVACION_MINUTOS: ${ACTIVACION_MINUTOS:-1440}
      RECUPERACION_MINUTOS: ${RECUPERACION_MINUTOS:-30}
      SESION_HORAS: ${SESION_HORAS:-8}
      DOCUMENTOS_MAX_MB: ${DOCUMENTOS_MAX_MB:-10}
      DOCUMENTOS_RUTA: /app/documentos
    volumes:
      - documentos:/app/documentos       # RF-DOC-05: los archivos viven en un volumen, no en la imagen
    restart: unless-stopped

  # Enviador de correos: la misma imagen, revisando la cola cada 15 s. No publica puertos.
  enviador:
    build: .
    command: ["dotnet", "/app/enviador/Inventario.EnviadorCorreos.dll", "--continuo"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=Inventario;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      CORREO_MODO: ${CORREO_MODO:-consola}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-true}
    restart: unless-stopped

volumes:
  datos-sqlserver:
  documentos:
